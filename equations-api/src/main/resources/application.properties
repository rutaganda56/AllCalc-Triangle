spring.application.name=equations-api
server.port=${PORT:8081}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
app.supabase.jwks-uri=${SUPABASE_JWKS_URI:https://invalid.local/auth/v1/.well-known/jwks.json}
app.supabase.jwt-issuer=${SUPABASE_JWT_ISSUER:https://invalid.local/auth/v1}
